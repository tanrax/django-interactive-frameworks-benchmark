services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --ws websockets --no-access-log"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-demo-secret-key-change-in-production"
      ALLOWED_HOSTS: "*"
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.clear-alerts.schedule: "0 0 3 * * *"
      ofelia.job-exec.clear-alerts.command: "python manage.py clear_alerts"

  scheduler:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - web

  bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    profiles: ["bench"]
    environment:
      BENCH_BASE_URL: http://web:8000
    volumes:
      - .:/bench
    working_dir: /bench
    depends_on:
      - web
    command: python run_performance_tests.py
